# Builds the APK in the cloud: push this folder to a (private) GitHub repo, open Actions -> "Android APK"
# -> the latest run -> Artifacts -> TankzorsPro-apk. Or press "Run workflow".
name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TankzorsPro-apk
          path: app/build/outputs/apk/release/*.apk
